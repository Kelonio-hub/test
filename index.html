<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forzando Likes - Test de Servidor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        input[type="text"] { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; background: #1e1e1e; color: white; font-size: 14px;}
        button { background-color: #007bff; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;}
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Prueba de Envío (LeoFame)</h2>
    <p>Este formulario se salta la web original y envía los datos directamente al servidor.</p>
    
    <!-- El formulario apunta a la URL original de la web que procesa los datos -->
    <form id="free-form" method="POST" action="https://leofame.com/free-youtube-likes">
        
        <!-- Campos ocultos obligatorios (Tokens y trampas de tiempo resueltas) -->
        <input type="hidden" name="token" value="1a26d017592cfd6f74459d0e61581f37"/>
        <input type="hidden" name="timezone_offset" id="tz_offset" value=""/>
        <input type="hidden" name="timezone_offset_2" value="1234"/>

        <!-- Campo visible con tu enlace de YouTube -->
        <input type="text" name="free_link" value="https://www.youtube.com/watch?v=Y9Q33T1ZQCA" required>

        <button type="submit">Forzar Envío de Likes</button>
    </form>
</div>

<script>
    // Rellenamos la zona horaria real automáticamente antes de enviar
    document.getElementById('tz_offset').value = new Date().getTimezoneOffset();
</script>

</body>
</html>
